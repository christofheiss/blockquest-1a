<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>BlockQuest 1A · Aufgaben-Prüfung</title>
<style>body{font:15px system-ui;margin:20px}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap}.ok{color:#1a7f37}.bad{color:#b3261e}</style></head>
<body>
<h1>Aufgaben-Prüfung</h1>
<p>Erzeugt je Station und Niveau 300 Aufgaben und prüft, ob die eigene Musterlösung als richtig erkannt wird. Öffnen über einen lokalen Webserver: <code>http://localhost:8765/tools/check.html</code></p>
<p id="sum">läuft …</p><pre id="log"></pre>
<script type="module">
import { BUILDINGS, checkPart, parseTerm, sameTerm } from '../js/tasks.js';
const log = [], N = 300; let bad = 0, n = 0;
const fail = (...a) => { bad++; if (log.length < 80) log.push(a.join(' ')); };
// Term-Leser: Selbsttest
const T = [['3a+2b', '2b + 3a', true], ['a^2+2ab', 'a·a + 2·a·b', true], ['a2 + 2ab', 'a(a+2b)', true], ['4(a+b)', '4a+4b', true], ['15x − 10', '5·(3x−2)', true],
  ['15x − 2', '5(3x−2)', false], ['7a+2b', '7a+2c', false], ['x²+5x+6', '(x+3)(x+2)', true], ['2,5a', '5a/2', true], ['−3x+4', '4−3x', true]];
for (const [a, b, want] of T) if (sameTerm(a, b) !== want) fail('sameTerm', a, b);
if (checkPart({ kind: 'term', answer: '7a + 2b', form: 'sum', n: 2 }, '3a + 4a + 2b')) fail('form sum nicht erkannt');
if (!checkPart({ kind: 'term', answer: '7a + 2b', form: 'sum', n: 2 }, '2b+7a')) fail('Reihenfolge');
if (!checkPart({ kind: 'term', answer: 'ab + b²', n: 2 }, 'b(a+b)')) fail('Produktterm');
for (const b of BUILDINGS) for (const s of [1, 2, 3]) for (let i = 0; i < N; i++) {
  n++;
  try {
    const t = b.gen(s); const parts = t.kind === 'multi' ? t.parts : [t];
    for (const p of parts) {
      if (p.kind === 'mc') { if (!(p.answer >= 0 && p.answer < p.options.length) || new Set(p.options).size !== p.options.length) fail('mc', b.id, s, JSON.stringify(p.options), p.answer); }
      else if (p.kind === 'term') { if (!parseTerm(p.answer) || !checkPart(p, p.answer)) fail('term', b.id, s, p.answer, p._note); }
      else if (!Number.isFinite(p.answer) || !checkPart(p, String(p.answer))) fail('num', b.id, s, p.answer);
    }
    if (t.probe !== undefined && !Number.isFinite(t.probe)) fail('probe', b.id, s);
    if (/NaN|undefined|Infinity|\[object/.test((t.q + t.sol + t.hint + JSON.stringify(t.parts || t.options || '')).replace(/src="data:[^"]+"/g, ''))) fail('text', b.id, s, t.q.replace(/src="data:[^"]+"/g, '').slice(0, 200));
  } catch (e) { fail('ERR', b.id, s, e.message); }
}
document.getElementById('sum').innerHTML = bad ? `<b class="bad">${bad} Probleme</b> bei ${n} Aufgaben` : `<b class="ok">Alle ${n} Aufgaben ok</b>`;
document.getElementById('log').textContent = log.join('\n');
window.checkResult = { bad, n, log };
</script>
</body></html>
